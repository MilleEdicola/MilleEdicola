:root {
  --cream: #f7f4ef;
  --black: #1a1a1a;
  --pink: #e84fa0;
  --grey: #8a8a8a;
  --light-grey: #d8d4cd;
}

html, body { width: 100%; height: 100%; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--cream);
  color: var(--black);
  overflow-x: hidden;
}

.hero {
  display: flex;
  flex-direction: row;
  width: 100%;
  min-height: 100vh;
}

.hero__image {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 100vh;
}

.hero__image img {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(20%);
  transition: filter 0.6s ease;
}

.hero__image:hover img { filter: grayscale(0%); }

.hero__image::before,
.hero__image::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: var(--pink);
  opacity: 0.85;
  z-index: 2;
  pointer-events: none;
}
.hero__image::before { width: 90px; height: 90px; bottom: 14%; left: 6%; }
.hero__image::after  { width: 55px; height: 55px; bottom: 10%; left: 18%; }

.hero__content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 70px;
  background: var(--cream);
  position: relative;
}

.hero__content::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 60% 30%, rgba(200,220,255,0.25) 0%, transparent 65%),
    radial-gradient(ellipse at 20% 80%, rgba(255,200,230,0.20) 0%, transparent 60%),
    radial-gradient(ellipse at 90% 70%, rgba(200,255,220,0.18) 0%, transparent 55%);
  pointer-events: none;
}

.hero__logo {
  width: 260px;
  max-width: 75%;
  margin-bottom: 40px;
  mix-blend-mode: multiply;
}

.hero__tagline {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.6rem, 2.5vw, 2.2rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--black);
  line-height: 1.3;
  margin-bottom: 12px;
}

.hero__tagline span { display: block; }

.hero__keywords {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 60px;
  margin-top: 22px;
}

.hero__divider {
  width: 40px;
  height: 2px;
  background: var(--black);
  margin-bottom: 32px;
}

.hero__info {
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 2.2;
  color: var(--black);
}

.hero__info a {
  color: var(--black);
  text-decoration: none;
  border-bottom: 1px solid var(--light-grey);
  transition: border-color 0.2s;
}
.hero__info a:hover { border-color: var(--pink); color: var(--pink); }
.hero__info .address { color: var(--grey); }

.hero__socials {
  display: flex;
  gap: 16px;
  margin-top: 32px;
}

.social-icon {
  width: 38px;
  height: 38px;
  border: 1.5px solid var(--black);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--black);
  transition: all 0.25s;
}
.social-icon:hover {
  background: var(--black);
  color: var(--cream);
  transform: translateY(-2px);
}
.social-icon svg { width: 18px; height: 18px; fill: currentColor; }

footer {
  border-top: 1px solid var(--light-grey);
  padding: 30px 10vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
footer span {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--light-grey);
}

@media (max-width: 900px) {
  .hero {
    flex-direction: column;
    min-height: auto;
  }
  .hero__image {
    width: 100%;
    height: 70vw;
    position: relative;
  }
  .hero__content {
    padding: 50px 32px 60px;
    align-items: center;
    text-align: center;
  }
  .hero__logo { width: 200px; }
  .hero__divider { margin-left: auto; margin-right: auto; }
  .hero__socials { justify-content: center; }
  footer { flex-direction: column; gap: 8px; text-align: center; }
}
