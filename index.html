:root {
  --cream: #f7f4ef;
  --black: #1a1a1a;
  --pink: #e84fa0;
  --grey: #8a8a8a;
  --light-grey: #d8d4cd;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--cream);
  color: var(--black);
  overflow-x: hidden;
}

/* ── HERO ── */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
  width: 100%;
}

.hero__image,
.hero__content {
  min-height: 100vh;
}

.hero__image {
  position: relative;
  overflow: hidden;
}

.hero__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(20%);
  transition: filter 0.6s ease;
}

.hero__image:hover img { filter: grayscale(0%); }

/* Pink dots overlay */
.hero__image::before,
.hero__image::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: var(--pink);
  opacity: 0.85;
  z-index: 2;
  pointer-events: none;
}
.hero__image::before { width: 90px; height: 90px; bottom: 14%; left: 6%; }
.hero__image::after  { width: 55px; height: 55px; bottom: 10%; left: 18%; }

.hero__content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 70px;
  background: var(--cream);
  position: relative;
}

/* subtle iridescent background */
.hero__content::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 60% 30%, rgba(200,220,255,0.25) 0%, transparent 65%),
              radial-gradient(ellipse at 20% 80%, rgba(255,200,230,0.20) 0%, transparent 60%),
              radial-gradient(ellipse at 90% 70%, rgba(200,255,220,0.18) 0%, transparent 55%);
  pointer-events: none;
}

.hero__logo {
  width: 260px;
  max-width: 75%;
  margin-bottom: 40px;
  /* If logo JPG has white background, use mix-blend-mode to blend */
  mix-blend-mode: multiply;
}

.hero__tagline {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1rem, 1.6vw, 1.35rem);
  font-weight: 300;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--black);
  line-height: 1.6;
  margin-bottom: 12px;
}

.hero__tagline span { display: block; }

.hero__keywords {
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 60px;
  margin-top: 22px;
}

.hero__divider {
  width: 40px;
  height: 1px;
  background: var(--light-grey);
  margin-bottom: 32px;
}

.hero__info {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 2;
  color: var(--black);
}

.hero__info a {
  color: var(--black);
  text-decoration: none;
  border-bottom: 1px solid var(--light-grey);
  transition: border-color 0.2s;
}
.hero__info a:hover { border-color: var(--pink); color: var(--pink); }

.hero__info .address { color: var(--grey); }

.hero__socials {
  display: flex;
  gap: 16px;
  margin-top: 32px;
}

.social-icon {
  width: 38px;
  height: 38px;
  border: 1.5px solid var(--black);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--black);
  transition: all 0.25s;
}
.social-icon:hover {
  background: var(--black);
  color: var(--cream);
  transform: translateY(-2px);
}

.social-icon svg { width: 18px; height: 18px; fill: currentColor; }

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 22px 50px;
  mix-blend-mode: multiply;
}

nav a {
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--black);
  margin-left: 36px;
  opacity: 0.6;
  transition: opacity 0.2s;
}
nav a:hover { opacity: 1; }

/* ── SECTION: CHI SIAMO ── */
.section {
  padding: 110px 10vw;
}

.section--alt {
  background: #f0ece5;
}

.section__label {
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--pink);
  margin-bottom: 22px;
}

.section__title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 4vw, 3.5rem);
  font-weight: 300;
  line-height: 1.15;
  margin-bottom: 30px;
  max-width: 600px;
}

.section__body {
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  line-height: 2;
  color: var(--grey);
  max-width: 500px;
}

/* ── GRID SECTION ── */
.section--grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}

.grid-item {
  padding: 70px 50px;
  border-left: 1px solid var(--light-grey);
  position: relative;
  overflow: hidden;
}
.grid-item:first-child { border-left: none; }

.grid-item__number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 5rem;
  font-weight: 300;
  color: var(--light-grey);
  line-height: 1;
  margin-bottom: 20px;
}

.grid-item__title {
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.grid-item__body {
  font-size: 0.75rem;
  line-height: 1.9;
  color: var(--grey);
}

.grid-item__dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--pink);
  position: absolute;
  top: 30px; right: 30px;
}

/* ── CONTATTI ── */
.contacts {
  padding: 100px 10vw;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.contacts__map {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--light-grey);
  border-radius: 2px;
  overflow: hidden;
}

.contacts__map iframe {
  width: 100%;
  height: 100%;
  border: none;
  filter: grayscale(0.5) contrast(1.1);
}

.contacts__details .section__label { margin-bottom: 14px; }
.contacts__details .section__title { font-size: clamp(1.8rem, 2.5vw, 2.6rem); margin-bottom: 28px; }

.contact-line {
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 2.4;
  color: var(--grey);
}
.contact-line a {
  color: var(--black);
  text-decoration: none;
  border-bottom: 1px solid var(--light-grey);
  transition: border-color 0.2s, color 0.2s;
}
.contact-line a:hover { border-color: var(--pink); color: var(--pink); }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--light-grey);
  padding: 30px 10vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

footer span {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--light-grey);
}

/* ── FADE-IN ANIMATION ── */
.fade-in {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.fade-in.visible {
  opacity: 1;
  transform: none;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; min-height: auto; }
  .hero__image { height: 55vw; }
  .hero__content { padding: 60px 36px; }
  .section--grid { grid-template-columns: 1fr; }
  .grid-item { border-left: none; border-top: 1px solid var(--light-grey); }
  .contacts { grid-template-columns: 1fr; }
  nav { padding: 18px 24px; }
  nav a { margin-left: 20px; }
}
